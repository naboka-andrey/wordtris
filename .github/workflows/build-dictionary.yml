name: Audit WORDtris

on:
  push:
    paths:
      - 'build_words.py'
      - 'patch_game.py'
      - 'test_game_logic.js'
      - '.github/workflows/build-dictionary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymorphy3 wordfreq
      - run: python build_words.py
      - run: python patch_game.py
      - name: Test shipped word-matching functions
        run: node test_game_logic.js
      - name: Dictionary and game sanity checks
        run: |
          python - <<'PY'
          from pathlib import Path
          w=Path('words.txt').read_text(encoding='utf-8').splitlines()
          ws=set(w)
          assert len(w)==len(ws)
          assert all(3 <= len(x) <= 16 for x in w)
          must={'том','дуб','бук','учи','еду','воин','вена','пат','мат','гол','сет','риф','кот','лес','дом','тихо','быстро','красная','играет'}
          bad={'осо','одав','ски','ооо','ааа','нии','мвд','гаи'}
          assert must <= ws, sorted(must-ws)
          assert not (bad & ws), sorted(bad&ws)
          html=Path('index.html').read_text(encoding='utf-8')
          assert "const s=new Set();const local=await fetch('words.txt?v=7'" in html
          assert 'async function boot(){await dict();reset();requestAnimationFrame(loop)}boot()' in html
          assert 'raw.githubusercontent.com/quadripartite' not in html
          Path('test_report.txt').write_text(
              'WORDtris audit passed\n'
              f'Dictionary forms: {len(w)}\n'
              'Tested: horizontal, vertical, equal-length overlap, H/V crossing, longest-word priority, wildcard longest match, invalid-word rejection, dictionary required/forbidden words.\n',
              encoding='utf-8')
          print('dictionary words:',len(w))
          PY
      - name: Commit audited outputs
        run: |
          if git diff --quiet -- words.txt dictionary_report.txt index.html test_report.txt; then
            echo 'No generated changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add words.txt dictionary_report.txt index.html test_report.txt
          git commit -m 'Record successful WORDtris audit [skip ci]'
          git push
