name: Apply Spanish mobile controls

on:
  push:
    paths:
      - 'ESP/patch_mobile.py'
      - '.github/workflows/apply-mobile-es.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ESP/patch_mobile.py
      - name: Validate Spanish mobile controls
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('ESP/index.html').read_text(encoding='utf-8')
          for x in ['id="touchHint"','id="mobileScore"','id="mobileLevel"','touchstart','touchend','CENT=0.28','rot()']:
              assert x in s, x
          print('Spanish mobile controls OK')
          PY
      - name: Commit patched game
        run: |
          if git diff --quiet -- ESP/index.html; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ESP/index.html
          git commit -m 'Apply Spanish mobile controls [skip ci]'
          git push
