name: Apply Russian mobile controls

on:
  push:
    paths:
      - 'patch_game.py'
      - '.github/workflows/apply-mobile-ru.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python patch_game.py
      - name: Validate mobile controls
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for x in ['id="mobileHint"','id="mobileScore"','id="mobileLevel"','touchstart','touchend','function hideMobileHint()']:
              assert x in s, x
          print('Russian mobile controls OK')
          PY
      - name: Commit patched game
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply Russian mobile controls [skip ci]'
          git push
